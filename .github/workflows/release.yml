name: Release

# Publishes the addon zip to CurseForge when a version tag is pushed
# (v1.4.0, v2.0.0-beta.1, ...) or when a GitHub Release is published.
# Pushing to main never publishes anything.
#
# The version comes from ## Version in GetInfoScan.toc. Bump it there, commit,
# then tag the commit — the tag only decides alpha / beta / release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.4.0"
        required: true
      dry_run:
        description: "Only build the zip, skip the CurseForge upload"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Creating a Release for a new tag also pushes the tag, so both triggers fire
# for the same version. The tag push runs first and the second run waits here,
# which is what lets the duplicate check below see its result.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  curseforge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          # The addon version is whatever GetInfoScan.toc says; the tag only
          # decides alpha / beta / release.
          version=$(sed -n 's/^##[[:space:]]*Version[[:space:]]*:[[:space:]]*//p' GetInfoScan.toc | head -n1 | tr -d '\r[:space:]')
          if [ -z "$version" ]; then
            echo "::error::GetInfoScan.toc has no ## Version line"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::version $version from GetInfoScan.toc (tag $tag)"

          # Do not upload the same version twice: if the tag push already
          # published it, this run only needs to confirm that.
          skip=false
          if [ "$EVENT" = "release" ]; then
            prior=$(gh run list --workflow=release.yml --limit 50 \
              --json headBranch,event,conclusion \
              --jq "[.[] | select(.headBranch == \"$tag\" and .event == \"push\" and .conclusion == \"success\")] | length")
            if [ "$prior" != "0" ]; then
              echo "::notice::$tag was already published by its tag push; skipping upload"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Check the packaging script
        if: steps.meta.outputs.skip != 'true'
        run: python3 .github/scripts/test_curseforge_release.py

      - name: Build changelog
        if: steps.meta.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$EVENT" = "release" ] && [ -n "$RELEASE_BODY" ]; then
            printf '%s\n' "$RELEASE_BODY" > dist/changelog.md
          else
            previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..$TAG" > dist/changelog.md
            else
              git log --no-merges --pretty='- %s' -n 50 > dist/changelog.md
            fi
            [ -s dist/changelog.md ] || echo "- $TAG" > dist/changelog.md
          fi
          echo "--- changelog ---"
          cat dist/changelog.md

      - name: Upload to CurseForge
        if: steps.meta.outputs.skip != 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/curseforge_release.py \
            --tag "${{ steps.meta.outputs.tag }}" \
            --changelog dist/changelog.md \
            --out-dir dist \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Keep the built zip
        if: always() && steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GetInfoScan-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: warn
