name: Release

# Publishes the addon when a version tag is pushed (v1.4.0, v2.0.0-beta.1, ...).
# A published GitHub Release is also a trigger, so a release created by hand
# works too. Pushing to main never publishes anything.
#
# You bump ## Version in GetInfoScan.toc yourself, commit it, then tag that
# commit. The workflow reads the version from the TOC, refuses to run if the
# tag and the TOC disagree, and publishes that version.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.4.0"
        required: true
      dry_run:
        description: "Only build the zip, skip the uploads"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Written into the Release body once the file is on CurseForge. A Release we
  # create ourselves fires this same workflow again; the marker is what tells
  # that second run the work is already done. More reliable than run history.
  MARKER: "<!-- cf-published"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            v*) tag_version="${tag#v}" ;;
            *)  tag_version="$tag" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"

          # The TOC is the source of truth; the tag must agree with it.
          version=$(sed -n 's/^##[[:space:]]*Version[[:space:]]*:[[:space:]]*//p' GetInfoScan.toc | head -n1 | tr -d '\r[:space:]')
          if [ -z "$version" ]; then
            echo "::error::GetInfoScan.toc has no ## Version line"
            exit 1
          fi
          if [ "$version" != "$tag_version" ]; then
            echo "::error::tag $tag says $tag_version but GetInfoScan.toc says $version — bump ## Version and commit before tagging"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing $version (tag $tag)"

          # This run was started by a Release we published ourselves.
          skip=false
          if [ "$EVENT" = "release" ] && [[ "$RELEASE_BODY" == *"$MARKER"* ]]; then
            echo "::notice::$tag was already published; nothing to do"
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Check the packaging script
        if: steps.meta.outputs.skip != 'true'
        run: python3 .github/scripts/test_curseforge_release.py

      - name: Build changelog
        if: steps.meta.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$EVENT" = "release" ] && [ -n "$RELEASE_BODY" ]; then
            printf '%s\n' "$RELEASE_BODY" > dist/changelog.md
          else
            previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..$TAG" > dist/changelog.md
            else
              git log --no-merges --pretty='- %s' -n 50 > dist/changelog.md
            fi
            [ -s dist/changelog.md ] || echo "- $TAG" > dist/changelog.md
          fi
          echo "--- changelog ---"
          cat dist/changelog.md

      - name: Upload to CurseForge
        if: steps.meta.outputs.skip != 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/curseforge_release.py \
            --tag "${{ steps.meta.outputs.tag }}" \
            --expect-version "${{ steps.meta.outputs.version }}" \
            --changelog dist/changelog.md \
            --out-dir dist \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Publish GitHub Release
        if: steps.meta.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            exit 0
          fi
          case "$VERSION" in
            *alpha*|*beta*) prerelease="--prerelease" ;;
            *)              prerelease="" ;;
          esac
          { cat dist/changelog.md; echo; echo "$MARKER -->"; } > dist/notes.md
          gh release create "$TAG" dist/*.zip \
            --title "GetInfoScan $VERSION" \
            --notes-file dist/notes.md \
            --verify-tag $prerelease

      - name: Keep the built zip
        if: always() && steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GetInfoScan-${{ steps.meta.outputs.version }}
          path: dist/*.zip
          if-no-files-found: warn
